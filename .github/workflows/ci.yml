name: C11 build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build strict and test
        run: make strict
      - name: Compile sanitizer instrumented binary
        run: make asan
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows EXE with MinGW-w64
        shell: cmd
        run: build-windows.cmd
      - name: Windows CMD smoke and parity tests
        shell: cmd
        run: |
          dist\cved.exe --version
          python tests\test_suite.py dist\cved.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Bila-ed-Windows-CMD
          path: dist/cved.exe
