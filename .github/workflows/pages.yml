name: Publish Bila-ed Website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  site:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: $\u007b\u007b steps.deployment.outputs.page_url \u007d\u007d
    steps:
      - uses: actions/checkout@v4
      - name: Validate static files and reference converter
        run: |
          test -s docs/index.html
          test -s docs/style.css
          test -s docs/app.js
          test -s docs/cvnss4_converter_audit_safe.js
          node --check docs/app.js
          node --check docs/cvnss4_converter_audit_safe.js
          node -e "const c=require('./docs/cvnss4_converter_audit_safe.js'); const t=c.selfTest(); if(!t.ok) process.exit(1); if(c.fromCvss('toiy iwy').cqn!=='tôi yêu') process.exit(1); console.log('CVNSS4.0 web reference self-test: '+t.tests+' passed');"
      - name: Configure Pages (enable if permitted)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
